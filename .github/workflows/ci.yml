name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Launch tests (unit + integration Testcontainers)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: ./mvnw test


  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4 #Retrieve the repository code on this machine

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven #Enable caching of Maven dependencies between runs, to speed up subsequent runs

      - name: Build .jar
        run: ./mvnw package -DskipTests