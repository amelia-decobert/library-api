<h1>Liste des livres</h1>

@if (loading()) {
<p>Chargement...</p>
} @else if (books().length === 0) {
<p>Aucun livre trouvé.</p>
} @else {
<ul>
  @for (book of books(); track book.id) {
  <li>
    <a [routerLink]="['/books', book.id]">
      {{ book.title }} — {{ book.author.name }}
    </a>
    @if (!book.available) {
    <span> (indisponible)</span>
    }
  </li>
  }
</ul>
}
